<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gil Tube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b1120;
        --bg-glow: radial-gradient(60rem 30rem at 50% -10%, rgba(56, 189, 248, 0.12), transparent 60%);
        --panel: #121a2e;
        --panel-alt: #0b1220;
        --text: #e9edf5;
        --muted: #8b96ab;
        --primary: #38bdf8;
        --primary-strong: #0ea5e9;
        --success: #22c55e;
        --danger: #f87171;
        --warning: #facc15;
        --border: #223049;
        --shadow: 0 12px 32px rgba(2, 6, 23, 0.45);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
        background: var(--bg) var(--bg-glow) no-repeat;
        color: var(--text);
        min-height: 100vh;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(11, 17, 32, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .topbar-inner {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 0.85rem 1rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      .topbar-search {
        display: flex;
        gap: 8px;
        flex: 1 1 260px;
        min-width: 0;
      }
      .topbar-search input[type="text"] {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
      }
      .topbar-search button {
        padding: 0.6rem 1.15rem;
        border-radius: 999px;
        flex-shrink: 0;
      }
      .page {
        display: flex;
        justify-content: center;
        padding: 1.75rem 1rem 3rem;
      }
      @media (max-width: 560px) {
        .topbar-search { flex-basis: 100%; }
      }
      .app {
        width: min(1100px, 100%);
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .layout {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      @media (min-width: 880px) {
        .layout {
          flex-direction: row;
          align-items: flex-start;
        }
        .layout-main { flex: 1 1 auto; min-width: 0; }
        .layout-side {
          flex: 0 0 360px;
          position: sticky;
          top: 1.5rem;
        }
      }
      .layout-main, .layout-side {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .brand-mark {
        font-size: 1.4rem;
        line-height: 1;
      }
      h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        white-space: nowrap;
        background: linear-gradient(90deg, var(--text), var(--primary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        margin: 0.15rem 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .card {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
      }
      form.url-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      input, select, button {
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 0.95rem;
        font-family: inherit;
      }
      input[type="url"], input[type="text"] {
        flex: 1 1 380px;
        padding: 0.85rem 1.1rem;
        background: var(--panel-alt);
        color: var(--text);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type="url"]:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }
      .search-results {
        margin-top: 1.1rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
      .result-card {
        cursor: pointer;
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .result-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }
      .result-thumb-wrap {
        position: relative;
        background: #000;
      }
      .result-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
      }
      .result-duration {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 4px;
        line-height: 1.4;
      }
      .result-info { padding: 0.55rem 0.65rem; }
      .result-title {
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 0 0 4px;
      }
      .result-meta {
        font-size: 0.7rem;
        color: var(--muted);
        margin: 0;
      }
      select {
        flex: 1 1 220px;
        padding: 0.7rem 0.9rem;
        background: var(--panel-alt);
        color: var(--text);
      }
      select:disabled { color: var(--muted); }
      button {
        padding: 0.85rem 1.3rem;
        background: linear-gradient(180deg, var(--primary), var(--primary-strong));
        color: #062033;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: filter 0.15s ease, transform 0.1s ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      button.secondary:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); filter: none; }
      .hidden { display: none !important; }
      .error-banner {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid var(--danger);
        color: var(--danger);
        border-radius: 12px;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }
      .preview-layout {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }
      .preview-embed {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        margin-bottom: 1rem;
      }
      .preview-embed iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .preview-meta h2 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
        line-height: 1.35;
      }
      .preview-meta p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .format-row {
        display: flex;
        gap: 10px;
        margin-top: 1.1rem;
        flex-wrap: wrap;
      }
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.9rem;
      }
      .status-pill {
        display: inline-block;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: rgba(56, 189, 248, 0.15);
        color: var(--primary);
      }
      .status-pill.completed { background: rgba(34, 197, 94, 0.15); color: var(--success); }
      .status-pill.failed, .status-pill.cancelled { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
      .status-pill.muxing { background: rgba(250, 204, 21, 0.15); color: var(--warning); }
      .progress-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: var(--panel-alt);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--primary-strong));
        transition: width 0.3s ease;
      }
      .progress-fill.indeterminate {
        width: 35%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { margin-left: -35%; }
        100% { margin-left: 100%; }
      }
      .progress-stats {
        display: flex;
        justify-content: space-between;
        margin-top: 0.5rem;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .segments {
        margin-top: 0.9rem;
      }
      .segments-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      /* One compact row holding every active connection's bar side by side,
         IDM-style, instead of a stacked list of full-width rows. */
      .segments-line {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        height: 30px;
      }
      .segment-bar {
        flex: 1;
        min-width: 4px;
        height: 100%;
        background: var(--panel-alt);
        border-radius: 3px;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
      }
      .segment-bar-fill {
        width: 100%;
        height: 0%;
        background: linear-gradient(180deg, var(--primary-strong), var(--primary));
        transition: height 0.3s ease;
      }
      .result-row {
        margin-top: 1rem;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      a.download-link {
        display: inline-block;
        padding: 0.85rem 1.3rem;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--success), #16a34a);
        color: #052e13;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">📼</span>
          <h1>Gil Tube</h1>
        </div>
        <form id="searchForm" class="topbar-search">
          <input id="searchInput" type="text" placeholder="Search YouTube…" />
          <button id="searchButton" type="submit">Search</button>
        </form>
      </div>
    </header>

    <div class="page">
    <div class="app">
      <div id="searchError" class="error-banner hidden"></div>

      <div class="layout">
        <div class="layout-main">
          <div id="searchResults" class="search-results hidden"></div>

          <div class="card">
            <p class="subtitle" style="margin-bottom: 0.9rem;">Or paste a link directly:</p>
            <form id="loadForm" class="url-form">
              <input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." required />
              <button id="loadButton" type="submit">Load</button>
            </form>
            <div id="loadError" class="error-banner hidden" style="margin-top: 0.9rem;"></div>
          </div>
        </div>

        <div class="layout-side">
          <div id="previewCard" class="card hidden">
            <div class="preview-layout">
              <div id="previewEmbed" class="preview-embed hidden">
                <div id="previewIframe"></div>
              </div>
              <div class="preview-body">
                <div class="preview-meta">
                  <h2 id="previewTitle"></h2>
                  <p id="previewSub"></p>
                </div>
                <div class="format-row">
                  <select id="formatSelect"></select>
                  <button id="downloadButton" type="button">Download</button>
                </div>
              </div>
            </div>
          </div>

          <div id="jobCard" class="card hidden">
            <div class="status-row">
              <span id="statusPill" class="status-pill">QUEUED</span>
              <button id="cancelButton" class="secondary" type="button">Cancel</button>
            </div>
            <div class="progress-track">
              <div id="progressFill" class="progress-fill indeterminate"></div>
            </div>
            <div class="progress-stats">
              <span id="progressBytes">0 B</span>
              <span id="progressSpeed"></span>
            </div>
            <div id="segmentsContainer" class="segments hidden">
              <div class="segments-label">Connections</div>
              <div id="segmentsList"></div>
            </div>
            <div id="resultRow" class="result-row hidden"></div>
          </div>
        </div>
      </div>
    </div>
    </div>

    <script>
      const API_BASE = 'http://localhost:8081';

      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      const searchButton = document.getElementById('searchButton');
      const searchError = document.getElementById('searchError');
      const searchResults = document.getElementById('searchResults');

      const loadForm = document.getElementById('loadForm');
      const urlInput = document.getElementById('urlInput');
      const loadButton = document.getElementById('loadButton');
      const loadError = document.getElementById('loadError');

      const previewCard = document.getElementById('previewCard');
      const previewEmbed = document.getElementById('previewEmbed');
      const previewIframe = document.getElementById('previewIframe');
      const previewTitle = document.getElementById('previewTitle');
      const previewSub = document.getElementById('previewSub');
      const formatSelect = document.getElementById('formatSelect');
      const downloadButton = document.getElementById('downloadButton');

      const jobCard = document.getElementById('jobCard');
      const statusPill = document.getElementById('statusPill');
      const cancelButton = document.getElementById('cancelButton');
      const progressFill = document.getElementById('progressFill');
      const progressBytes = document.getElementById('progressBytes');
      const progressSpeed = document.getElementById('progressSpeed');
      const segmentsContainer = document.getElementById('segmentsContainer');
      const segmentsList = document.getElementById('segmentsList');
      const resultRow = document.getElementById('resultRow');

      let currentURL = '';
      let pollTimer = null;
      let currentJobId = null;

      // In-page preview via the official YouTube IFrame Player API. This is
      // the standard "keyless" embed mechanism (no Data API key needed,
      // unlike search) - it just needs the API script loaded and a single
      // persistent YT.Player instance that we re-cue per video rather than
      // recreating an iframe every time.
      let ytPlayer = null;
      let ytApiReady = false;
      let pendingVideoId = null;

      window.onYouTubeIframeAPIReady = function () {
        ytApiReady = true;
        if (pendingVideoId) {
          showVideoPreview(pendingVideoId);
          pendingVideoId = null;
        }
      };

      function showVideoPreview(videoId) {
        if (!videoId) {
          previewEmbed.classList.add('hidden');
          return;
        }
        previewEmbed.classList.remove('hidden');

        if (!ytApiReady) {
          pendingVideoId = videoId;
          return;
        }
        if (ytPlayer) {
          ytPlayer.cueVideoById(videoId);
        } else {
          ytPlayer = new YT.Player('previewIframe', {
            videoId,
            playerVars: { rel: 0, modestbranding: 1 },
          });
        }
      }

      function showError(message) {
        loadError.textContent = message;
        loadError.classList.remove('hidden');
      }

      function clearError() {
        loadError.classList.add('hidden');
        loadError.textContent = '';
      }

      function formatBytes(bytes) {
        if (bytes === null || bytes === undefined) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let value = bytes;
        let unitIndex = 0;
        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex += 1;
        }
        return `${value.toFixed(unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
      }

      function formatDuration(totalSeconds) {
        if (!totalSeconds && totalSeconds !== 0) return '';
        const seconds = Math.floor(totalSeconds % 60);
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const hours = Math.floor(totalSeconds / 3600);
        const pad = (n) => String(n).padStart(2, '0');
        return hours > 0 ? `${hours}:${pad(minutes)}:${pad(seconds)}` : `${minutes}:${pad(seconds)}`;
      }

      function formatLabel(format) {
        const parts = [];
        if (format.height) parts.push(`${format.height}p`);
        else parts.push('audio');
        if (format.container) parts.push(format.container);
        if (format.filesize) parts.push(formatBytes(format.filesize));
        return `${parts.join(' · ')} (${format.id})`;
      }

      // Result titles/channel names come from third-party YouTube content,
      // so they're untrusted and must be escaped before going into innerHTML.
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
      }

      async function runSearch(query) {
        searchError.classList.add('hidden');
        searchError.textContent = '';
        if (!query) return;

        searchButton.disabled = true;
        searchButton.textContent = 'Searching…';

        try {
          const response = await fetch(`${API_BASE}/api/v1/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, limit: 12 }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Search failed.';
            searchError.textContent = message;
            searchError.classList.remove('hidden');
            searchResults.classList.add('hidden');
            return;
          }

          renderSearchResults(data.results || []);
        } catch (err) {
          searchError.textContent = `Connection error: ${err.message}`;
          searchError.classList.remove('hidden');
        } finally {
          searchButton.disabled = false;
          searchButton.textContent = 'Search';
        }
      }

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        runSearch(searchInput.value.trim());
      });

      // Seed the page with results instead of a blank state on first load.
      const DEFAULT_SEARCH_QUERY = 'Rwanda SDA music';
      searchInput.value = DEFAULT_SEARCH_QUERY;
      runSearch(DEFAULT_SEARCH_QUERY);

      function renderSearchResults(results) {
        if (!results.length) {
          searchResults.innerHTML = '<p class="subtitle">No results.</p>';
          searchResults.classList.remove('hidden');
          return;
        }

        searchResults.innerHTML = results
          .map((result, index) => {
            const durationLabel = formatDuration(result.duration);
            const meta = result.uploader || '';
            return `
              <div class="result-card" data-index="${index}">
                <div class="result-thumb-wrap">
                  <img class="result-thumb" src="${escapeHtml(result.thumbnail || '')}" alt="" loading="lazy" />
                  ${durationLabel ? `<span class="result-duration">${escapeHtml(durationLabel)}</span>` : ''}
                </div>
                <div class="result-info">
                  <p class="result-title">${escapeHtml(result.title || 'Untitled')}</p>
                  <p class="result-meta">${escapeHtml(meta)}</p>
                </div>
              </div>`;
          })
          .join('');
        searchResults.classList.remove('hidden');

        searchResults.querySelectorAll('.result-card').forEach((card) => {
          card.addEventListener('click', () => {
            const result = results[Number(card.dataset.index)];
            if (!result || !result.url) return;
            selectSearchResult(result);
          });
        });
      }

      // Search results already carry title/thumbnail/uploader/duration, so
      // clicking one shows the preview instantly instead of re-fetching and
      // re-showing a blank "Loading…" state. Only the format list still
      // needs a fresh call, since a flat search entry has no per-format CDN
      // URLs (only full extraction resolves those) - so that part loads in
      // the background while the rest of the preview is already visible.
      async function selectSearchResult(result) {
        clearError();
        currentURL = result.url;
        urlInput.value = result.url;
        jobCard.classList.add('hidden');

        renderPreviewShell(result);
        formatSelect.innerHTML = '<option>Loading formats…</option>';
        formatSelect.disabled = true;
        downloadButton.disabled = true;

        try {
          const response = await fetch(`${API_BASE}/api/v1/preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: result.url }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Could not load formats for this video.';
            showError(message);
            formatSelect.innerHTML = '<option value="">Formats unavailable</option>';
            return;
          }

          populateFormatOptions(data.formats);
        } catch (err) {
          showError(`Connection error: ${err.message}`);
          formatSelect.innerHTML = '<option value="">Formats unavailable</option>';
        } finally {
          formatSelect.disabled = false;
          downloadButton.disabled = false;
        }
      }

      loadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError();
        previewCard.classList.add('hidden');
        jobCard.classList.add('hidden');

        const url = urlInput.value.trim();
        if (!url) return;

        loadButton.disabled = true;
        loadButton.textContent = 'Loading…';

        try {
          const response = await fetch(`${API_BASE}/api/v1/preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Could not load this URL.';
            showError(message);
            return;
          }

          currentURL = url;
          renderPreview(data);
        } catch (err) {
          showError(`Connection error: ${err.message}`);
        } finally {
          loadButton.disabled = false;
          loadButton.textContent = 'Load';
        }
      });

      // Renders the parts of the preview we may already know without a
      // network call: title, embed, duration, uploader. Shared by the
      // paste-a-URL flow (after /api/v1/preview) and the search-click flow
      // (from the search result itself, before formats have even loaded).
      function renderPreviewShell(info) {
        previewTitle.textContent = info.title || 'Untitled';
        const metaParts = [];
        if (info.duration) metaParts.push(formatDuration(info.duration));
        if (info.uploader) metaParts.push(info.uploader);
        previewSub.textContent = metaParts.join(' · ');

        showVideoPreview(info.id);

        previewCard.classList.remove('hidden');
      }

      function populateFormatOptions(formats) {
        const filtered = (formats || []).filter((f) => f.id && (f.height || f.container));
        filtered.sort((a, b) => (b.height || 0) - (a.height || 0));

        formatSelect.innerHTML = '';
        const bestOption = document.createElement('option');
        bestOption.value = '';
        bestOption.textContent = 'Best available';
        formatSelect.appendChild(bestOption);
        for (const format of filtered) {
          const option = document.createElement('option');
          option.value = format.id;
          option.textContent = formatLabel(format);
          formatSelect.appendChild(option);
        }
      }

      function renderPreview(info) {
        renderPreviewShell(info);
        populateFormatOptions(info.formats);
      }

      downloadButton.addEventListener('click', async () => {
        clearError();
        downloadButton.disabled = true;
        downloadButton.textContent = 'Starting…';

        try {
          const response = await fetch(`${API_BASE}/api/v1/jobs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: currentURL, format: formatSelect.value || undefined }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Could not start the download.';
            showError(message);
            return;
          }

          startJobTracking(data.job_id);
        } catch (err) {
          showError(`Connection error: ${err.message}`);
        } finally {
          downloadButton.disabled = false;
          downloadButton.textContent = 'Download';
        }
      });

      function startJobTracking(jobId) {
        currentJobId = jobId;
        jobCard.classList.remove('hidden');
        resultRow.classList.add('hidden');
        resultRow.innerHTML = '';
        cancelButton.classList.remove('hidden');
        cancelButton.disabled = false;
        setStatus('QUEUED');
        progressFill.classList.add('indeterminate');
        progressFill.style.width = '';
        progressBytes.textContent = '0 B';
        progressSpeed.textContent = '';
        segmentsContainer.classList.add('hidden');
        segmentsList.innerHTML = '';

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(() => pollJob(jobId), 1000);
        pollJob(jobId);
      }

      function setStatus(status) {
        statusPill.textContent = status;
        statusPill.className = 'status-pill';
        if (status === 'COMPLETED') statusPill.classList.add('completed');
        if (status === 'FAILED' || status === 'CANCELLED') statusPill.classList.add('failed');
        if (status === 'MUXING') statusPill.classList.add('muxing');
      }

      // Renders every active connection as a single vertical bar in one
      // compact row (IDM-style), rather than a stacked list of full-width
      // rows. Each bar's fill percentage is approximate: workers dynamically
      // pull small byte-range granules off a shared queue rather than owning
      // a fixed range, so there's no exact per-connection target — an equal
      // (bytes_total / connection count) share is used as the denominator
      // just to give each bar a sense of scale relative to the others.
      function renderSegments(progress) {
        const segments = progress.segments || [];
        if (segments.length < 2) {
          segmentsContainer.classList.add('hidden');
          segmentsList.innerHTML = '';
          return;
        }

        const total = progress.bytes_total;
        const fairShare = total ? total / segments.length : null;
        const bars = segments
          .map((bytes) => {
            const percent = fairShare ? Math.min(100, (bytes / fairShare) * 100) : 0;
            return `<div class="segment-bar" title="${formatBytes(bytes)}"><div class="segment-bar-fill" style="height:${percent.toFixed(0)}%"></div></div>`;
          })
          .join('');
        segmentsList.innerHTML = `<div class="segments-line">${bars}</div>`;
        segmentsContainer.classList.remove('hidden');
      }

      function renderDownloadProgress(progress) {
        const downloaded = progress.bytes_downloaded || 0;
        const total = progress.bytes_total;
        if (total) {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = `${Math.min(100, (downloaded / total) * 100).toFixed(1)}%`;
          progressBytes.textContent = `${formatBytes(downloaded)} / ${formatBytes(total)}`;
        } else {
          progressFill.classList.add('indeterminate');
          progressBytes.textContent = formatBytes(downloaded);
        }
        progressSpeed.textContent = progress.speed_bytes_per_second
          ? `${formatBytes(progress.speed_bytes_per_second)}/s`
          : '';
        renderSegments(progress);
      }

      function renderMuxProgress(percent) {
        segmentsContainer.classList.add('hidden');
        progressFill.classList.remove('indeterminate');
        progressFill.style.width = `${percent}%`;
        progressBytes.textContent = 'Merging audio and video…';
        progressSpeed.textContent = `${percent}%`;
      }

      async function pollJob(jobId) {
        try {
          const [jobRes, progressRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/jobs/${jobId}`),
            fetch(`${API_BASE}/api/v1/jobs/${jobId}/progress`),
          ]);
          const job = await jobRes.json();
          const progress = await progressRes.json();

          if (jobId !== currentJobId) return;

          // job.status is the coarse, DB-tracked state (QUEUED/READY/
          // DOWNLOADING/COMPLETED/...). progress.status reflects the
          // downloader's live sub-phase (DOWNLOADING vs MUXING) while a
          // download is in flight, so prefer it until the job is terminal.
          const displayStatus = job.status === 'DOWNLOADING' && progress.status ? progress.status : job.status;
          setStatus(displayStatus);

          if (displayStatus === 'MUXING') {
            renderMuxProgress(progress.mux_progress_percent || 0);
          } else {
            renderDownloadProgress(progress);
          }

          if (['COMPLETED', 'FAILED', 'CANCELLED'].includes(job.status)) {
            clearInterval(pollTimer);
            pollTimer = null;
            cancelButton.classList.add('hidden');
            segmentsContainer.classList.add('hidden');
            renderFinal(job);
          }
        } catch (err) {
          // Transient network hiccup while polling; keep trying on the next tick.
        }
      }

      function renderFinal(job) {
        resultRow.classList.remove('hidden');
        if (job.status === 'COMPLETED') {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = '100%';
          const link = document.createElement('a');
          link.className = 'download-link';
          link.href = `${API_BASE}/api/v1/jobs/${job.job_id}/file`;
          link.textContent = 'Save file';
          resultRow.appendChild(link);
        } else {
          const message = document.createElement('span');
          message.style.color = 'var(--danger)';
          message.textContent = job.error_message
            ? `${job.status}: ${job.error_message}`
            : job.status;
          resultRow.appendChild(message);
        }
      }

      cancelButton.addEventListener('click', async () => {
        if (!currentJobId) return;
        cancelButton.disabled = true;
        try {
          await fetch(`${API_BASE}/api/v1/jobs/${currentJobId}/cancel`, { method: 'POST' });
        } catch (err) {
          // Ignore: the next poll tick will reflect whatever state actually won.
        }
      });
    </script>
    <!-- Loaded after our script so window.onYouTubeIframeAPIReady is already
         defined by the time this (async) script finishes fetching. -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
