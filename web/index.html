<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gil Tube</title>
    <script>
      // Runs synchronously before paint so the correct theme applies from
      // the first frame instead of flashing dark (the default) then
      // switching to a saved/system light preference.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
          // localStorage unavailable (private mode etc.) - falls back to the default dark theme.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b1120;
        --bg-glow: radial-gradient(60rem 30rem at 50% -10%, rgba(56, 189, 248, 0.12), transparent 60%);
        --panel: #121a2e;
        --panel-alt: #0b1220;
        --text: #e9edf5;
        --muted: #8b96ab;
        --primary: #38bdf8;
        --primary-strong: #0ea5e9;
        --success: #22c55e;
        --danger: #f87171;
        --warning: #facc15;
        --border: #223049;
        --shadow: 0 12px 32px rgba(2, 6, 23, 0.45);
        --topbar-bg: rgba(11, 17, 32, 0.85);
      }
      :root[data-theme="light"] {
        --bg: #f3f5fa;
        --bg-glow: radial-gradient(60rem 30rem at 50% -10%, rgba(14, 165, 233, 0.08), transparent 60%);
        --panel: #ffffff;
        --panel-alt: #eef1f7;
        --text: #101728;
        --muted: #5b6478;
        --primary: #0ea5e9;
        --primary-strong: #0284c7;
        --success: #16a34a;
        --danger: #dc2626;
        --warning: #b45309;
        --border: #dde3ee;
        --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        --topbar-bg: rgba(255, 255, 255, 0.85);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
        background: var(--bg) var(--bg-glow) no-repeat;
        color: var(--text);
        min-height: 100vh;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .theme-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 999px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 1.05rem;
        flex-shrink: 0;
      }
      .theme-toggle:hover:not(:disabled) { background: var(--panel-alt); filter: brightness(1.15); }
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        background: rgba(2, 6, 23, 0.6);
      }
      .modal-overlay.hidden { display: none; }
      .modal-card {
        position: relative;
        width: 100%;
        max-width: 320px;
        padding: 1.5rem;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .modal-card h2 { margin: 0 0 0.6rem; font-size: 1.05rem; }
      .modal-close {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.85rem;
      }
      .modal-hint { color: var(--muted); font-size: 0.82rem; line-height: 1.5; margin: 0 0 1rem; }
      .modal-qr {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        margin-bottom: 1rem;
        padding: 12px;
        background: #fff;
        border-radius: 10px;
      }
      .modal-qr canvas { display: block; }
      .modal-url-label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 0.3rem; }
      .modal-url {
        display: block;
        width: 100%;
        padding: 0.5rem 0.7rem;
        border-radius: 8px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: inherit;
        font-size: 0.85rem;
        box-sizing: border-box;
      }
      .modal-edit-hint { color: var(--muted); font-size: 0.72rem; margin: 0.4rem 0 0; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--topbar-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }
      .topbar-inner {
        width: min(1240px, 100%);
        margin: 0 auto;
        padding: 0.85rem 1rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      .topbar-search {
        display: flex;
        gap: 8px;
        flex: 1 1 260px;
        min-width: 0;
      }
      .search-input-wrap {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }
      .topbar-search input[type="text"] {
        width: 100%;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
      }
      .topbar-search button {
        padding: 0.6rem 1.15rem;
        border-radius: 999px;
        flex-shrink: 0;
      }
      .search-suggestions {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
        z-index: 20;
      }
      .search-suggestion-item {
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
        cursor: pointer;
        color: var(--text);
      }
      .search-suggestion-item:hover { background: var(--panel-alt); color: var(--primary); }
      .page {
        display: flex;
        justify-content: center;
        padding: 1.75rem 1rem 3rem;
      }
      @media (max-width: 560px) {
        .topbar-search { flex-basis: 100%; }
      }
      .app {
        width: min(1240px, 100%);
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .layout {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      @media (min-width: 880px) {
        .layout {
          flex-direction: row;
          align-items: flex-start;
        }
        .layout-main {
          flex: 1 1 auto;
          min-width: 0;
          /* Its own scroll region so results (and infinite-scroll loading of
             cached videos) never pushes the page itself, keeping the
             preview/download column always in view without relying on
             sticky positioning racing the page's own scroll. */
          max-height: calc(100vh - 150px);
          overflow-y: auto;
          padding-right: 10px;
          /* Firefox */
          scrollbar-width: thin;
          scrollbar-color: var(--border) transparent;
        }
        .layout-main::-webkit-scrollbar { width: 7px; }
        .layout-main::-webkit-scrollbar-track { background: transparent; }
        .layout-main::-webkit-scrollbar-thumb {
          background: var(--border);
          border-radius: 999px;
        }
        .layout-main::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        .layout-side {
          flex: 0 0 440px;
          position: sticky;
          top: 1.5rem;
        }
      }
      .layout-main, .layout-side {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .brand-mark {
        font-size: 1.4rem;
        line-height: 1;
      }
      h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        white-space: nowrap;
        background: linear-gradient(90deg, var(--text), var(--primary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        margin: 0.15rem 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .card {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
        transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      form.url-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      input, select, button {
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 0.95rem;
        font-family: inherit;
      }
      input[type="url"], input[type="text"] {
        flex: 1 1 380px;
        padding: 0.85rem 1.1rem;
        background: var(--panel-alt);
        color: var(--text);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type="url"]:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }
      .results-heading {
        margin: 1.1rem 0 -0.4rem;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .search-results {
        margin-top: 1.1rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .result-card {
        cursor: pointer;
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .result-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }
      .result-thumb-wrap {
        position: relative;
        background: #000;
      }
      .result-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
      }
      .result-duration {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 4px;
        line-height: 1.4;
      }
      .result-info { padding: 0.55rem 0.65rem; }
      .result-title {
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 0 0 4px;
      }
      .result-meta {
        font-size: 0.7rem;
        color: var(--muted);
        margin: 0;
      }
      select {
        flex: 1 1 220px;
        padding: 0.7rem 0.9rem;
        background: var(--panel-alt);
        color: var(--text);
      }
      select:disabled { color: var(--muted); }
      button {
        padding: 0.85rem 1.3rem;
        background: linear-gradient(180deg, var(--primary), var(--primary-strong));
        color: #062033;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: filter 0.15s ease, transform 0.1s ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      button.secondary:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); filter: none; }
      .link-button {
        align-self: flex-start;
        background: none;
        border: none;
        color: var(--muted);
        padding: 0.2rem 0;
        font-weight: 600;
        font-size: 0.85rem;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .link-button:hover:not(:disabled) { color: var(--primary); background: none; filter: none; }
      .hidden { display: none !important; }
      .error-banner {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid var(--danger);
        color: var(--danger);
        border-radius: 12px;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }
      .preview-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        min-height: 220px;
        text-align: center;
        color: var(--muted);
        border-style: dashed;
      }
      .preview-placeholder .placeholder-icon {
        font-size: 2rem;
        opacity: 0.7;
      }
      .preview-placeholder p {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .preview-layout {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }
      .preview-embed {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        margin-bottom: 1rem;
      }
      .preview-embed iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .expand-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        padding: 0.3rem 0.55rem;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.95rem;
        line-height: 1;
      }
      .expand-toggle:hover:not(:disabled) { background: rgba(0, 0, 0, 0.8); filter: none; }
      .preview-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.75);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 50;
      }
      #previewCard.expanded {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(920px, 94vw);
        max-height: 92vh;
        overflow-y: auto;
        z-index: 51;
      }
      .preview-meta h2 {
        margin: 0 0 0.35rem;
        font-size: 1.1rem;
        line-height: 1.35;
      }
      .preview-meta p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .format-row {
        display: flex;
        gap: 10px;
        margin-top: 1.1rem;
        flex-wrap: wrap;
      }
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.9rem;
      }
      .status-pill {
        display: inline-block;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: rgba(56, 189, 248, 0.15);
        color: var(--primary);
      }
      .status-pill.completed { background: rgba(34, 197, 94, 0.15); color: var(--success); }
      .status-pill.failed, .status-pill.cancelled { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
      .status-pill.muxing { background: rgba(250, 204, 21, 0.15); color: var(--warning); }
      .progress-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: var(--panel-alt);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--primary-strong));
        transition: width 0.3s ease;
      }
      .progress-fill.indeterminate {
        width: 35%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { margin-left: -35%; }
        100% { margin-left: 100%; }
      }
      .progress-stats {
        display: flex;
        justify-content: space-between;
        margin-top: 0.5rem;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .segments {
        margin-top: 0.9rem;
      }
      .segments-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      /* One compact row holding every active connection's bar side by side,
         IDM-style, instead of a stacked list of full-width rows. */
      .segments-line {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        height: 30px;
      }
      .segment-bar {
        flex: 1;
        min-width: 4px;
        height: 100%;
        background: var(--panel-alt);
        border-radius: 3px;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
      }
      .segment-bar-fill {
        width: 100%;
        height: 0%;
        background: linear-gradient(180deg, var(--primary-strong), var(--primary));
        transition: height 0.3s ease;
      }
      .result-row {
        margin-top: 1rem;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      a.download-link {
        display: inline-block;
        padding: 0.85rem 1.3rem;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--success), #16a34a);
        color: #052e13;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">📼</span>
          <h1>Gil Tube</h1>
        </div>
        <form id="searchForm" class="topbar-search">
          <div class="search-input-wrap">
            <input id="searchInput" type="text" placeholder="Search YouTube…" autocomplete="off" />
            <div id="searchSuggestions" class="search-suggestions hidden"></div>
          </div>
          <button id="searchButton" type="submit">Search</button>
        </form>
        <button id="mobileConnectToggle" class="theme-toggle" type="button" title="Connect the mobile app">📱</button>
        <button id="themeToggle" class="theme-toggle" type="button" title="Toggle light/dark theme">🌙</button>
      </div>
    </header>

    <div id="mobileConnectModal" class="modal-overlay hidden">
      <div class="modal-card">
        <button id="mobileConnectClose" class="modal-close" type="button" aria-label="Close">✕</button>
        <h2>Connect the mobile app</h2>
        <p id="mobileConnectHint" class="modal-hint"></p>
        <div id="mobileConnectQr" class="modal-qr"></div>
        <p class="modal-url-label">API address</p>
        <input id="mobileConnectUrl" class="modal-url" type="text" autocomplete="off" spellcheck="false" />
        <p class="modal-edit-hint">Not right? Edit it (e.g. swap in your computer's LAN IP) - the QR code updates as you type.</p>
      </div>
    </div>

    <div class="page">
    <div class="app">
      <div id="searchError" class="error-banner hidden"></div>

      <div class="layout">
        <div id="layoutMain" class="layout-main">
          <p id="resultsHeading" class="results-heading hidden"></p>
          <div id="searchResults" class="search-results hidden"></div>
        </div>

        <div class="layout-side">
          <button id="pasteLinkToggle" class="link-button" type="button">+ Paste a link directly</button>

          <div id="pasteLinkCard" class="card hidden">
            <form id="loadForm" class="url-form">
              <input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." required />
              <button id="loadButton" type="submit">Load</button>
            </form>
            <div id="loadError" class="error-banner hidden" style="margin-top: 0.9rem;"></div>
          </div>

          <div id="previewPlaceholder" class="card preview-placeholder">
            <div class="placeholder-icon">🎬</div>
            <p>Click on a video to view</p>
          </div>

          <div id="previewCard" class="card hidden">
            <div class="preview-layout">
              <div id="previewEmbed" class="preview-embed hidden">
                <div id="previewIframe"></div>
                <button id="expandPreviewButton" class="expand-toggle" type="button" title="Expand">⤢</button>
              </div>
              <div class="preview-body">
                <div class="preview-meta">
                  <h2 id="previewTitle"></h2>
                  <p id="previewSub"></p>
                </div>
                <div class="format-row">
                  <select id="formatSelect"></select>
                  <button id="downloadButton" type="button">Download</button>
                </div>
              </div>
            </div>
          </div>

          <div id="jobCard" class="card hidden">
            <div class="status-row">
              <span id="statusPill" class="status-pill">QUEUED</span>
              <button id="cancelButton" class="secondary" type="button">Cancel</button>
            </div>
            <div class="progress-track">
              <div id="progressFill" class="progress-fill indeterminate"></div>
            </div>
            <div class="progress-stats">
              <span id="progressBytes">0 B</span>
              <span id="progressSpeed"></span>
            </div>
            <div id="segmentsContainer" class="segments hidden">
              <div class="segments-label">Connections</div>
              <div id="segmentsList"></div>
            </div>
            <div id="resultRow" class="result-row hidden"></div>
          </div>
        </div>
      </div>
    </div>
    </div>

    <div id="previewOverlay" class="preview-overlay hidden"></div>

    <script>
      const API_BASE = 'http://localhost:8081';

      const themeToggle = document.getElementById('themeToggle');
      const mobileConnectToggle = document.getElementById('mobileConnectToggle');
      const mobileConnectModal = document.getElementById('mobileConnectModal');
      const mobileConnectClose = document.getElementById('mobileConnectClose');
      const mobileConnectHint = document.getElementById('mobileConnectHint');
      const mobileConnectQr = document.getElementById('mobileConnectQr');
      const mobileConnectUrl = document.getElementById('mobileConnectUrl');
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchInput');
      const searchSuggestions = document.getElementById('searchSuggestions');
      const searchButton = document.getElementById('searchButton');
      const searchError = document.getElementById('searchError');
      const resultsHeading = document.getElementById('resultsHeading');
      const searchResults = document.getElementById('searchResults');
      const layoutMain = document.getElementById('layoutMain');

      const pasteLinkToggle = document.getElementById('pasteLinkToggle');
      const pasteLinkCard = document.getElementById('pasteLinkCard');

      const loadForm = document.getElementById('loadForm');
      const urlInput = document.getElementById('urlInput');
      const loadButton = document.getElementById('loadButton');
      const loadError = document.getElementById('loadError');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
        try {
          localStorage.setItem('theme', theme);
        } catch (err) {
          // Theme just won't persist across reloads in this browser/mode.
        }
      }

      applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(current === 'light' ? 'dark' : 'light');
      });

      // The mobile app can't reach "localhost" on this machine, but
      // window.location.hostname is exactly the address THIS browser used
      // to reach the page - so if this page was opened from the phone (or
      // from this computer's LAN IP), that same hostname is guaranteed to
      // be reachable for the API too, on port 8081.
      function computeMobileApiUrl() {
        const hostname = window.location.hostname;
        const isLocal = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1';
        return { url: `${window.location.protocol}//${hostname}:8081`, isLocal };
      }

      let qrCodeLibPromise = null;
      function loadQrCodeLib() {
        if (window.QRCode) return Promise.resolve();
        if (!qrCodeLibPromise) {
          qrCodeLibPromise = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
            script.onload = () => resolve();
            script.onerror = () => reject(new Error('Could not load the QR code library.'));
            document.head.appendChild(script);
          });
        }
        return qrCodeLibPromise;
      }

      // Renders a QR code for whatever's currently in the address field.
      // Called both when the modal opens and on every edit, so typing in a
      // corrected LAN IP (when the page was opened via localhost) updates
      // the code live instead of requiring a reopen.
      function renderMobileConnectQr(url) {
        if (!/^https?:\/\/\S+$/i.test(url)) {
          mobileConnectQr.innerHTML = '';
          mobileConnectQr.textContent = 'Type a valid address above to generate a QR code.';
          return;
        }
        loadQrCodeLib()
          .then(() => {
            const canvas = document.createElement('canvas');
            QRCode.toCanvas(canvas, url, { width: 200, margin: 1 }, (err) => {
              if (err) {
                mobileConnectQr.innerHTML = '';
                mobileConnectQr.textContent = 'QR code unavailable - use the address above.';
                return;
              }
              mobileConnectQr.innerHTML = '';
              mobileConnectQr.appendChild(canvas);
            });
          })
          .catch(() => {
            mobileConnectQr.innerHTML = '';
            mobileConnectQr.textContent = 'QR code unavailable (offline?) - use the address above.';
          });
      }

      function openMobileConnectModal() {
        const { url, isLocal } = computeMobileApiUrl();
        mobileConnectUrl.value = url;
        mobileConnectModal.classList.remove('hidden');

        mobileConnectHint.textContent = isLocal
          ? 'This page is open locally, so this address only works on this computer. Either edit it below to your computer\'s LAN IP (e.g. http://192.168.1.20:8081 - find it with ipconfig/ifconfig), or reopen this page from that LAN IP so it comes pre-filled correctly.'
          : 'In the Gil Tube app, open Settings and tap "Scan QR" to fill this in automatically - or type the address below by hand.';

        renderMobileConnectQr(url);
        mobileConnectUrl.focus();
        mobileConnectUrl.select();
      }

      mobileConnectToggle.addEventListener('click', openMobileConnectModal);
      mobileConnectClose.addEventListener('click', () => mobileConnectModal.classList.add('hidden'));
      mobileConnectModal.addEventListener('click', (event) => {
        if (event.target === mobileConnectModal) mobileConnectModal.classList.add('hidden');
      });

      let mobileConnectDebounce = null;
      mobileConnectUrl.addEventListener('input', () => {
        if (mobileConnectDebounce) clearTimeout(mobileConnectDebounce);
        mobileConnectDebounce = setTimeout(() => renderMobileConnectQr(mobileConnectUrl.value.trim()), 300);
      });

      pasteLinkToggle.addEventListener('click', () => {
        const willShow = pasteLinkCard.classList.contains('hidden');
        pasteLinkCard.classList.toggle('hidden', !willShow);
        pasteLinkToggle.textContent = willShow ? '− Hide link field' : '+ Paste a link directly';
        if (willShow) urlInput.focus();
      });

      const previewPlaceholder = document.getElementById('previewPlaceholder');
      const previewCard = document.getElementById('previewCard');
      const previewEmbed = document.getElementById('previewEmbed');
      const previewIframe = document.getElementById('previewIframe');
      const previewTitle = document.getElementById('previewTitle');
      const previewSub = document.getElementById('previewSub');
      const formatSelect = document.getElementById('formatSelect');
      const downloadButton = document.getElementById('downloadButton');
      const expandPreviewButton = document.getElementById('expandPreviewButton');
      const previewOverlay = document.getElementById('previewOverlay');

      function setPreviewExpanded(expanded) {
        previewCard.classList.toggle('expanded', expanded);
        previewOverlay.classList.toggle('hidden', !expanded);
        expandPreviewButton.textContent = expanded ? '⤡' : '⤢';
        expandPreviewButton.title = expanded ? 'Collapse' : 'Expand';
      }

      expandPreviewButton.addEventListener('click', () => {
        setPreviewExpanded(!previewCard.classList.contains('expanded'));
      });

      previewOverlay.addEventListener('click', () => setPreviewExpanded(false));

      const jobCard = document.getElementById('jobCard');
      const statusPill = document.getElementById('statusPill');
      const cancelButton = document.getElementById('cancelButton');
      const progressFill = document.getElementById('progressFill');
      const progressBytes = document.getElementById('progressBytes');
      const progressSpeed = document.getElementById('progressSpeed');
      const segmentsContainer = document.getElementById('segmentsContainer');
      const segmentsList = document.getElementById('segmentsList');
      const resultRow = document.getElementById('resultRow');

      let currentURL = '';
      let pollTimer = null;
      let currentJobId = null;

      // In-page preview via the official YouTube IFrame Player API. This is
      // the standard "keyless" embed mechanism (no Data API key needed,
      // unlike search) - it just needs the API script loaded and a single
      // persistent YT.Player instance that we re-cue per video rather than
      // recreating an iframe every time.
      let ytPlayer = null;
      let ytApiReady = false;
      let pendingVideoId = null;

      window.onYouTubeIframeAPIReady = function () {
        ytApiReady = true;
        if (pendingVideoId) {
          showVideoPreview(pendingVideoId);
          pendingVideoId = null;
        }
      };

      function showVideoPreview(videoId) {
        if (!videoId) {
          previewEmbed.classList.add('hidden');
          return;
        }
        previewEmbed.classList.remove('hidden');

        if (!ytApiReady) {
          pendingVideoId = videoId;
          return;
        }
        if (ytPlayer) {
          ytPlayer.cueVideoById(videoId);
        } else {
          ytPlayer = new YT.Player('previewIframe', {
            videoId,
            playerVars: { rel: 0, modestbranding: 1 },
          });
        }
      }

      function showError(message) {
        loadError.textContent = message;
        loadError.classList.remove('hidden');
      }

      function clearError() {
        loadError.classList.add('hidden');
        loadError.textContent = '';
      }

      function formatBytes(bytes) {
        if (bytes === null || bytes === undefined) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let value = bytes;
        let unitIndex = 0;
        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex += 1;
        }
        return `${value.toFixed(unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
      }

      function formatDuration(totalSeconds) {
        if (!totalSeconds && totalSeconds !== 0) return '';
        const seconds = Math.floor(totalSeconds % 60);
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const hours = Math.floor(totalSeconds / 3600);
        const pad = (n) => String(n).padStart(2, '0');
        return hours > 0 ? `${hours}:${pad(minutes)}:${pad(seconds)}` : `${minutes}:${pad(seconds)}`;
      }

      function formatLabel(format) {
        const parts = [];
        if (format.height) parts.push(`${format.height}p`);
        else parts.push('audio');
        if (format.container) parts.push(format.container);
        if (format.filesize) parts.push(formatBytes(format.filesize));
        return `${parts.join(' · ')} (${format.id})`;
      }

      // Result titles/channel names come from third-party YouTube content,
      // so they're untrusted and must be escaped before going into innerHTML.
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
      }

      function setResultsHeading(text) {
        if (!text) {
          resultsHeading.classList.add('hidden');
          resultsHeading.textContent = '';
          return;
        }
        resultsHeading.textContent = text;
        resultsHeading.classList.remove('hidden');
      }

      async function runSearch(query) {
        searchError.classList.add('hidden');
        searchError.textContent = '';
        if (!query) return;

        // A live search returns one fixed batch, not a paged feed - disable
        // cached-video infinite scroll so scrolling here doesn't try to
        // "load more" of the previous cached view.
        cachedVideosHasMore = false;

        searchButton.disabled = true;
        searchButton.textContent = 'Searching…';

        try {
          const response = await fetch(`${API_BASE}/api/v1/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, limit: 12 }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Search failed.';
            searchError.textContent = message;
            searchError.classList.remove('hidden');
            searchResults.classList.add('hidden');
            setResultsHeading('');
            return;
          }

          setResultsHeading(`Results for "${query}"`);
          renderSearchResults(data.results || []);
        } catch (err) {
          searchError.textContent = `Connection error: ${err.message}`;
          searchError.classList.remove('hidden');
        } finally {
          searchButton.disabled = false;
          searchButton.textContent = 'Search';
        }
      }

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        runSearch(searchInput.value.trim());
      });

      // Seed the page with whatever's already cached (instant, no live
      // search needed) instead of a blank state. Only falls back to a live
      // search on a cold cache (nothing searched yet anywhere).
      const DEFAULT_SEARCH_QUERY = 'Rwanda SDA music';
      const CACHED_PAGE_SIZE = 24;

      // Infinite scroll only applies to the cached-videos view: a live
      // search returns one fixed batch from yt-dlp per query, not a paged
      // feed, so there's nothing to page through there.
      let cachedVideosOffset = 0;
      let cachedVideosHasMore = false;
      let loadingMoreCached = false;

      // Populated from /api/v1/cached-searches' `queries` field and offered
      // as "recent search" suggestions while typing - see wireSearchSuggestions.
      let cachedQueries = [];

      async function loadInitialResults() {
        searchInput.value = DEFAULT_SEARCH_QUERY;
        cachedVideosHasMore = false;
        try {
          const response = await fetch(`${API_BASE}/api/v1/cached-searches?limit=${CACHED_PAGE_SIZE}&offset=0`);
          if (response.ok) {
            const data = await response.json();
            cachedQueries = data.queries || [];
            if (data.videos && data.videos.length) {
              setResultsHeading('Cached videos');
              renderSearchResults(data.videos);
              cachedVideosOffset = data.videos.length;
              cachedVideosHasMore = !!data.has_more;
              return;
            }
          }
        } catch (err) {
          // Fall through to a live search below.
        }
        runSearch(DEFAULT_SEARCH_QUERY);
      }

      function renderSearchSuggestions(matches) {
        if (!matches.length) {
          searchSuggestions.classList.add('hidden');
          searchSuggestions.innerHTML = '';
          return;
        }
        searchSuggestions.innerHTML = matches.map((q) => `<div class="search-suggestion-item">${escapeHtml(q)}</div>`).join('');
        searchSuggestions.classList.remove('hidden');
        searchSuggestions.querySelectorAll('.search-suggestion-item').forEach((item, i) => {
          // mousedown (not click) fires before the input's blur handler
          // hides the dropdown, so the selection still registers.
          item.addEventListener('mousedown', (event) => {
            event.preventDefault();
            searchSuggestions.classList.add('hidden');
            searchInput.value = matches[i];
            runSearch(matches[i]);
          });
        });
      }

      function wireSearchSuggestions() {
        searchInput.addEventListener('input', () => {
          const value = searchInput.value.trim().toLowerCase();
          const matches = value
            ? cachedQueries.filter((q) => q.toLowerCase().includes(value))
            : cachedQueries;
          renderSearchSuggestions(matches.slice(0, 8));
        });
        searchInput.addEventListener('focus', () => {
          if (!searchInput.value.trim()) renderSearchSuggestions(cachedQueries.slice(0, 8));
        });
        searchInput.addEventListener('blur', () => {
          setTimeout(() => searchSuggestions.classList.add('hidden'), 150);
        });
      }
      wireSearchSuggestions();

      async function loadMoreCachedVideos() {
        if (loadingMoreCached || !cachedVideosHasMore) return;
        loadingMoreCached = true;
        try {
          const response = await fetch(
            `${API_BASE}/api/v1/cached-searches?limit=${CACHED_PAGE_SIZE}&offset=${cachedVideosOffset}`
          );
          if (response.ok) {
            const data = await response.json();
            const videos = data.videos || [];
            appendSearchResults(videos);
            cachedVideosOffset += videos.length;
            cachedVideosHasMore = !!data.has_more;
          }
        } catch (err) {
          // Ignore - the user can just scroll again to retry.
        } finally {
          loadingMoreCached = false;
        }
      }

      // The first column scrolls internally on desktop (its own overflow-y,
      // see .layout-main), so its own scroll events - not the window's -
      // are what fire there. On narrow screens it has no internal scroll
      // (falls back to the page scrolling normally), so the window listener
      // covers that case. Both stay attached; only one actually fires scroll
      // events at any given viewport width.
      function checkInfiniteScroll() {
        if (!cachedVideosHasMore || loadingMoreCached) return;
        const nearBottomOfColumn = layoutMain.scrollTop + layoutMain.clientHeight >= layoutMain.scrollHeight - 600;
        const nearBottomOfPage = window.innerHeight + window.scrollY >= document.body.offsetHeight - 600;
        if (nearBottomOfColumn || nearBottomOfPage) loadMoreCachedVideos();
      }
      window.addEventListener('scroll', checkInfiniteScroll);
      layoutMain.addEventListener('scroll', checkInfiniteScroll);

      loadInitialResults();

      // currentResultsList backs the click handlers below: cards reference
      // it by index rather than closing over a per-call `results` array, so
      // appendSearchResults() (infinite scroll) can add more cards without
      // invalidating the indices of cards already on the page.
      let currentResultsList = [];

      function resultCardHtml(result, index) {
        const durationLabel = formatDuration(result.duration);
        const meta = result.uploader || '';
        return `
          <div class="result-card" data-index="${index}">
            <div class="result-thumb-wrap">
              <img class="result-thumb" src="${escapeHtml(result.thumbnail || '')}" alt="" loading="lazy" />
              ${durationLabel ? `<span class="result-duration">${escapeHtml(durationLabel)}</span>` : ''}
            </div>
            <div class="result-info">
              <p class="result-title">${escapeHtml(result.title || 'Untitled')}</p>
              <p class="result-meta">${escapeHtml(meta)}</p>
            </div>
          </div>`;
      }

      function wireResultCard(card) {
        card.addEventListener('click', () => {
          const result = currentResultsList[Number(card.dataset.index)];
          if (!result || !result.url) return;
          selectSearchResult(result);
        });
      }

      function renderSearchResults(results) {
        currentResultsList = results.slice();
        if (!results.length) {
          searchResults.innerHTML = '<p class="subtitle">No results.</p>';
          searchResults.classList.remove('hidden');
          return;
        }

        searchResults.innerHTML = results.map((result, index) => resultCardHtml(result, index)).join('');
        searchResults.classList.remove('hidden');
        searchResults.querySelectorAll('.result-card').forEach(wireResultCard);
        prewarmTopResults(results);
      }

      // Full extraction (needed to actually download) is the slow part -
      // typically several seconds, since it resolves direct CDN URLs and
      // runs YouTube's signature-decipher logic per format. Search itself is
      // fast (flat/lightweight), so most of a click's latency is that first
      // extraction. Firing it in the background for the top few results as
      // soon as they're shown means it's often already cached by the time
      // the user actually clicks one. Deliberately only called from a fresh
      // render (a new search, or the initial cached-videos load) and not
      // from appendSearchResults (infinite scroll) - unbounded background
      // extraction as the user scrolls would defeat the point.
      const PREWARM_COUNT = 3;
      const PREWARM_STAGGER_MS = 400;

      function prewarmTopResults(results) {
        results.slice(0, PREWARM_COUNT).forEach((result, index) => {
          if (!result.url) return;
          setTimeout(() => {
            fetch(`${API_BASE}/api/v1/preview`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: result.url }),
            }).catch(() => {
              // Fire-and-forget: worst case, this video just isn't cached
              // yet and the user's eventual click pays the normal cost.
            });
          }, index * PREWARM_STAGGER_MS);
        });
      }

      function appendSearchResults(results) {
        if (!results.length) return;
        const startIndex = currentResultsList.length;
        currentResultsList = currentResultsList.concat(results);

        const html = results.map((result, i) => resultCardHtml(result, startIndex + i)).join('');
        searchResults.insertAdjacentHTML('beforeend', html);

        const cards = searchResults.querySelectorAll('.result-card');
        for (let i = startIndex; i < cards.length; i++) {
          wireResultCard(cards[i]);
        }
      }

      // Search results already carry title/thumbnail/uploader/duration, so
      // clicking one shows the preview instantly instead of re-fetching and
      // re-showing a blank "Loading…" state. Only the format list still
      // needs a fresh call, since a flat search entry has no per-format CDN
      // URLs (only full extraction resolves those) - so that part loads in
      // the background while the rest of the preview is already visible.
      async function selectSearchResult(result) {
        clearError();
        currentURL = result.url;
        urlInput.value = result.url;
        jobCard.classList.add('hidden');

        renderPreviewShell(result);
        formatSelect.innerHTML = '<option>Loading formats…</option>';
        formatSelect.disabled = true;
        downloadButton.disabled = true;

        try {
          const response = await fetch(`${API_BASE}/api/v1/preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: result.url }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Could not load formats for this video.';
            showError(message);
            formatSelect.innerHTML = '<option value="">Formats unavailable</option>';
            return;
          }

          populateFormatOptions(data.formats);
        } catch (err) {
          showError(`Connection error: ${err.message}`);
          formatSelect.innerHTML = '<option value="">Formats unavailable</option>';
        } finally {
          formatSelect.disabled = false;
          downloadButton.disabled = false;
        }
      }

      loadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError();
        previewCard.classList.add('hidden');
        jobCard.classList.add('hidden');

        const url = urlInput.value.trim();
        if (!url) return;

        loadButton.disabled = true;
        loadButton.textContent = 'Loading…';

        try {
          const response = await fetch(`${API_BASE}/api/v1/preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Could not load this URL.';
            showError(message);
            return;
          }

          currentURL = url;
          renderPreview(data);
        } catch (err) {
          showError(`Connection error: ${err.message}`);
        } finally {
          loadButton.disabled = false;
          loadButton.textContent = 'Load';
        }
      });

      // Renders the parts of the preview we may already know without a
      // network call: title, embed, duration, uploader. Shared by the
      // paste-a-URL flow (after /api/v1/preview) and the search-click flow
      // (from the search result itself, before formats have even loaded).
      function renderPreviewShell(info) {
        previewTitle.textContent = info.title || 'Untitled';
        const metaParts = [];
        if (info.duration) metaParts.push(formatDuration(info.duration));
        if (info.uploader) metaParts.push(info.uploader);
        previewSub.textContent = metaParts.join(' · ');

        showVideoPreview(info.id);

        previewPlaceholder.classList.add('hidden');
        previewCard.classList.remove('hidden');
      }

      function populateFormatOptions(formats) {
        const filtered = (formats || []).filter((f) => f.id && (f.height || f.container));
        filtered.sort((a, b) => (b.height || 0) - (a.height || 0));

        formatSelect.innerHTML = '';
        const bestOption = document.createElement('option');
        bestOption.value = '';
        bestOption.textContent = 'Best available';
        formatSelect.appendChild(bestOption);
        for (const format of filtered) {
          const option = document.createElement('option');
          option.value = format.id;
          option.textContent = formatLabel(format);
          formatSelect.appendChild(option);
        }
      }

      function renderPreview(info) {
        renderPreviewShell(info);
        populateFormatOptions(info.formats);
      }

      downloadButton.addEventListener('click', async () => {
        clearError();
        downloadButton.disabled = true;
        downloadButton.textContent = 'Starting…';

        try {
          const response = await fetch(`${API_BASE}/api/v1/jobs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: currentURL, format: formatSelect.value || undefined }),
          });
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.error ? data.error.message : 'Could not start the download.';
            showError(message);
            return;
          }

          startJobTracking(data.job_id);
        } catch (err) {
          showError(`Connection error: ${err.message}`);
        } finally {
          downloadButton.disabled = false;
          downloadButton.textContent = 'Download';
        }
      });

      function startJobTracking(jobId) {
        currentJobId = jobId;
        jobCard.classList.remove('hidden');
        resultRow.classList.add('hidden');
        resultRow.innerHTML = '';
        cancelButton.classList.remove('hidden');
        cancelButton.disabled = false;
        setStatus('QUEUED');
        progressFill.classList.add('indeterminate');
        progressFill.style.width = '';
        progressBytes.textContent = '0 B';
        progressSpeed.textContent = '';
        segmentsContainer.classList.add('hidden');
        segmentsList.innerHTML = '';

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(() => pollJob(jobId), 1000);
        pollJob(jobId);
      }

      function setStatus(status) {
        statusPill.textContent = status;
        statusPill.className = 'status-pill';
        if (status === 'COMPLETED') statusPill.classList.add('completed');
        if (status === 'FAILED' || status === 'CANCELLED') statusPill.classList.add('failed');
        if (status === 'MUXING') statusPill.classList.add('muxing');
      }

      // Renders every active connection as a single vertical bar in one
      // compact row (IDM-style), rather than a stacked list of full-width
      // rows. Each bar's fill percentage is approximate: workers dynamically
      // pull small byte-range granules off a shared queue rather than owning
      // a fixed range, so there's no exact per-connection target — an equal
      // (bytes_total / connection count) share is used as the denominator
      // just to give each bar a sense of scale relative to the others.
      function renderSegments(progress) {
        const segments = progress.segments || [];
        if (segments.length < 2) {
          segmentsContainer.classList.add('hidden');
          segmentsList.innerHTML = '';
          return;
        }

        const total = progress.bytes_total;
        const fairShare = total ? total / segments.length : null;
        const bars = segments
          .map((bytes) => {
            const percent = fairShare ? Math.min(100, (bytes / fairShare) * 100) : 0;
            return `<div class="segment-bar" title="${formatBytes(bytes)}"><div class="segment-bar-fill" style="height:${percent.toFixed(0)}%"></div></div>`;
          })
          .join('');
        segmentsList.innerHTML = `<div class="segments-line">${bars}</div>`;
        segmentsContainer.classList.remove('hidden');
      }

      function renderDownloadProgress(progress) {
        const downloaded = progress.bytes_downloaded || 0;
        const total = progress.bytes_total;
        if (total) {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = `${Math.min(100, (downloaded / total) * 100).toFixed(1)}%`;
          progressBytes.textContent = `${formatBytes(downloaded)} / ${formatBytes(total)}`;
        } else {
          progressFill.classList.add('indeterminate');
          progressBytes.textContent = formatBytes(downloaded);
        }
        progressSpeed.textContent = progress.speed_bytes_per_second
          ? `${formatBytes(progress.speed_bytes_per_second)}/s`
          : '';
        renderSegments(progress);
      }

      function renderMuxProgress(percent) {
        segmentsContainer.classList.add('hidden');
        progressFill.classList.remove('indeterminate');
        progressFill.style.width = `${percent}%`;
        progressBytes.textContent = 'Merging audio and video…';
        progressSpeed.textContent = `${percent}%`;
      }

      async function pollJob(jobId) {
        try {
          const [jobRes, progressRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/jobs/${jobId}`),
            fetch(`${API_BASE}/api/v1/jobs/${jobId}/progress`),
          ]);
          const job = await jobRes.json();
          const progress = await progressRes.json();

          if (jobId !== currentJobId) return;

          // job.status is the coarse, DB-tracked state (QUEUED/READY/
          // DOWNLOADING/COMPLETED/...). progress.status reflects the
          // downloader's live sub-phase (DOWNLOADING vs MUXING) while a
          // download is in flight, so prefer it until the job is terminal.
          const displayStatus = job.status === 'DOWNLOADING' && progress.status ? progress.status : job.status;
          setStatus(displayStatus);

          if (displayStatus === 'MUXING') {
            renderMuxProgress(progress.mux_progress_percent || 0);
          } else {
            renderDownloadProgress(progress);
          }

          if (['COMPLETED', 'FAILED', 'CANCELLED'].includes(job.status)) {
            clearInterval(pollTimer);
            pollTimer = null;
            cancelButton.classList.add('hidden');
            segmentsContainer.classList.add('hidden');
            renderFinal(job);
          }
        } catch (err) {
          // Transient network hiccup while polling; keep trying on the next tick.
        }
      }

      function renderFinal(job) {
        resultRow.classList.remove('hidden');
        if (job.status === 'COMPLETED') {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = '100%';
          const link = document.createElement('a');
          link.className = 'download-link';
          link.href = `${API_BASE}/api/v1/jobs/${job.job_id}/file`;
          link.textContent = 'Save file';
          resultRow.appendChild(link);
        } else {
          const message = document.createElement('span');
          message.style.color = 'var(--danger)';
          message.textContent = job.error_message
            ? `${job.status}: ${job.error_message}`
            : job.status;
          resultRow.appendChild(message);
        }
      }

      cancelButton.addEventListener('click', async () => {
        if (!currentJobId) return;
        cancelButton.disabled = true;
        try {
          await fetch(`${API_BASE}/api/v1/jobs/${currentJobId}/cancel`, { method: 'POST' });
        } catch (err) {
          // Ignore: the next poll tick will reflect whatever state actually won.
        }
      });
    </script>
    <!-- Loaded after our script so window.onYouTubeIframeAPIReady is already
         defined by the time this (async) script finishes fetching. -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
